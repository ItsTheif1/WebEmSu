<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webemsu Frontend</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --tile-bg: #1a1a1a;
            --blue-border: #2b5c8f;
            --yellow-border: #d4a33e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-edit {
            background: #2a2a2a;
            color: #ccc;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .status {
            color: #aaa;
            font-size: 14px;
        }

        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 900px;
            align-items: flex-start;
        }

        /* Base tile. Buttons are used so tiles are keyboard-accessible. */
        .tile {
            width: 100px;
            height: 100px;
            background: var(--tile-bg);
            border: 2px solid transparent;
            border-radius: 20px;
            color: var(--text-color);
            font-size: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            padding: 0;
            transition: transform 0.2s, box-shadow 0.2s, width 0.35s ease, height 0.35s ease;
        }

        .tile:hover,
        .tile:focus-visible {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            outline: none;
        }

        .tile-wide {
            width: 220px;
            height: 100px;
            flex-direction: row;
            justify-content: flex-start;
            padding-left: 20px;
            gap: 15px;
        }

        .tile-wide .icon-circle {
            width: 50px;
            height: 50px;
            background: #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .tile-wide .text-content {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .tile-wide .text-content h3 {
            margin: 0;
            font-size: 16px;
        }

        .tile-wide .text-content p {
            margin: 5px 0 0;
            font-size: 12px;
            color: #aaa;
        }

        .border-blue { border-color: var(--blue-border); }
        .border-yellow { border-color: var(--yellow-border); }

        .tile-label {
            font-size: 12px;
            background: #333;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* Music tile: small when idle, grows to show the player. */
        .music-tile {
            width: 180px;
            height: 180px;
            cursor: pointer;
        }

        .music-tile.active {
            width: 420px;
            height: 320px;
            cursor: default;
            transform: none;
        }

        .music-tile.active .tile-idle {
            display: none;
        }

        .music-panel {
            position: absolute;
            inset: 0;
            display: none;
            background: #000;
            border-radius: 18px;
            overflow: hidden;
        }

        .music-tile.active .music-panel {
            display: block;
        }

        .music-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .music-panel iframe.ready {
            opacity: 1;
        }

        .loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            color: #bbb;
            font-size: 14px;
            background: linear-gradient(160deg, #1b1b1b, #000);
            transition: opacity 0.4s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid #333;
            border-top-color: var(--blue-border);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-note {
            font-size: 12px;
            color: #888;
            min-height: 16px;
        }

        .music-close {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 16px;
            line-height: 28px;
            text-align: center;
            cursor: pointer;
            padding: 0;
        }

        .music-close:hover {
            background: rgba(200, 40, 40, 0.9);
        }

        #rom-upload { display: none; }

        #games {
            display: none;
            margin-bottom: 20px;
        }

        .game-mode-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20000;
        }

        .game-mode-modal.hidden {
            display: none;
        }

        .mode-panel {
            width: min(420px, 90vw);
            background: #111;
            border: 1px solid #2b5c8f;
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }

        .mode-panel h2 {
            margin: 0 0 16px;
            font-size: 24px;
        }

        .mode-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .mode-btn {
            border: 2px solid #2b5c8f;
            background: linear-gradient(180deg, #1a1a1a, #111);
            color: #fff;
            border-radius: 14px;
            padding: 18px 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            border-color: #d4a33e;
        }

        /* Full-screen emulator */
        #emulator-wrapper {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: none;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        .close-emulator {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10000;
            background: #c62828;
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="games"></div>

    <div class="top-bar">
        <button class="btn-edit">Friends</button>
        <button class="btn-edit">Edit Mode</button>
        <div class="status">9:20 a.m. | 20% | Wi-Fi</div>
    </div>

    <div id="game-mode-modal" class="game-mode-modal hidden" aria-modal="true" role="dialog">
        <div class="mode-panel">
            <h2>Choose a game source</h2>
            <div class="mode-options">
                <button class="mode-btn" data-mode="emulator">Emulator</button>
                <button class="mode-btn" data-mode="browser">Browser</button>
            </div>
        </div>
    </div>

    <div class="grid-container">

        <button class="tile tile-wide" style="background: linear-gradient(135deg, #222, #111);">
            <div class="icon-circle">↺</div>
            <div class="text-content">
                <h3>Jump Back In!</h3>
                <p>No recent game</p>
            </div>
        </button>

        <button class="tile tile-wide border-blue" id="discover-tile">
            <div class="icon-circle">🎮</div>
            <div class="text-content">
                <h3>Discover</h3>
                <p>Add games</p>
            </div>
        </button>

        <input type="file" id="rom-upload"
               accept=".nes,.smc,.sfc,.n64,.z64,.gba,.gbc,.gb,.nds">

        <button class="tile">🔴</button>
        <button class="tile">📷</button>

        <!-- Music tile: a div so the player can sit inside it cleanly. -->
        <div class="tile music-tile border-blue" id="music-tile"
             role="button" tabindex="0" aria-label="Open music player">
            <div class="tile-idle" style="display: flex; flex-direction: column; align-items: center;">
                <span style="font-size: 40px;">🎵</span>
                <span class="tile-label">Music Player</span>
            </div>

            <div class="music-panel" id="music-panel">
                <button class="music-close" id="music-close" aria-label="Close music player">✕</button>

                <div class="loading-screen" id="music-loading">
                    <div class="spinner"></div>
                    <div>Tuning in…</div>
                    <div class="loading-note" id="music-note"></div>
                </div>
            </div>
        </div>

        <button class="tile">🏆</button>
        <button class="tile">💬</button>
        <button class="tile">⚙️</button>
        <button class="tile" style="background: #fff;">🗂️</button>

    </div>

    <div id="emulator-wrapper">
        <button class="close-emulator" id="close-emulator">Close Game</button>
        <div id="game"></div>
    </div>

    <script>
        const LOADER_URL = "https://cdn.emulatorjs.org/stable/data/loader.js";
        const DATA_PATH = "https://cdn.emulatorjs.org/stable/data/";
        const MUSIC_URL = "https://freefy.app";
        const SLOW_LOAD_MS = 8000;
        const LUMINSDK_URL = "https://cdn.jsdelivr.net/gh/luminsdk/script@latest/fonts.min.js";

        // Maps a file extension to an EmulatorJS core name.
        const CORE_BY_EXTENSION = {
            nes: "nes",
            smc: "snes",
            sfc: "snes",
            n64: "n64",
            z64: "n64",
            gba: "gba",
            gb: "gb",
            gbc: "gb",
            nds: "nds"
        };

        const emulatorWrapper = document.getElementById("emulator-wrapper");
        const romInput = document.getElementById("rom-upload");
        const discoverTile = document.getElementById("discover-tile");
        const musicTile = document.getElementById("music-tile");
        const musicPanel = document.getElementById("music-panel");
        const musicLoading = document.getElementById("music-loading");
        const musicNote = document.getElementById("music-note");
        const musicClose = document.getElementById("music-close");
        const closeButton = document.getElementById("close-emulator");
        const modeModal = document.getElementById("game-mode-modal");
        const modeButtons = document.querySelectorAll(".mode-btn");
        const gamesContainer = document.getElementById("games");

        let currentBlobUrl = null;
        let musicFrame = null;
        let slowTimer = null;
        let luminLoaded = false;

        function openGameModeModal() {
            modeModal.classList.remove("hidden");
        }

        function closeGameModeModal() {
            modeModal.classList.add("hidden");
        }

        function loadLuminSDK() {
            if (luminLoaded && window.Lumin) return Promise.resolve();

            return new Promise((resolve, reject) => {
                const existingScript = document.querySelector('script[src="' + LUMINSDK_URL + '"]');

                if (existingScript) {
                    existingScript.addEventListener("load", () => {
                        luminLoaded = true;
                        resolve();
                    }, { once: true });
                    existingScript.addEventListener("error", reject, { once: true });
                    return;
                }

                const script = document.createElement("script");
                script.src = LUMINSDK_URL;
                script.onload = () => {
                    luminLoaded = true;
                    if (window.Lumin) {
                        Lumin.init({ container: '#games', theme: 'dark' });
                    }
                    resolve();
                };
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }

        /* ---------- Music player ---------- */

        function openMusic() {
            if (musicTile.classList.contains("active")) return;
            musicTile.classList.add("active");
            musicTile.setAttribute("aria-label", "Music player");

            musicLoading.classList.remove("hidden");
            musicNote.textContent = "";

            musicFrame = document.createElement("iframe");
            musicFrame.title = "Music player";
            musicFrame.allow = "autoplay; encrypted-media";
            musicFrame.addEventListener("load", onMusicLoaded);
            musicFrame.src = MUSIC_URL;
            musicPanel.insertBefore(musicFrame, musicLoading);

            clearTimeout(slowTimer);
            slowTimer = setTimeout(() => {
                if (!musicLoading.classList.contains("hidden")) {
                    musicNote.textContent = "This is taking a while. Check your connection.";
                }
            }, SLOW_LOAD_MS);
        }

        function onMusicLoaded() {
            clearTimeout(slowTimer);
            musicLoading.classList.add("hidden");
            musicFrame.classList.add("ready");
        }

        function closeMusic() {
            clearTimeout(slowTimer);
            if (musicFrame) {
                musicFrame.remove();
                musicFrame = null;
            }
            musicTile.classList.remove("active");
            musicTile.setAttribute("aria-label", "Open music player");
        }

        musicTile.addEventListener("click", openMusic);
        musicTile.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openMusic();
            }
        });

        musicClose.addEventListener("click", (event) => {
            event.stopPropagation();
            closeMusic();
        });

        /* ---------- Games ---------- */

        function detectCore(fileName) {
            const parts = fileName.toLowerCase().split(".");
            const ext = parts.length > 1 ? parts.pop() : "";
            return CORE_BY_EXTENSION[ext] || null;
        }

        function teardownEmulator() {
            const instance = window.EJS_emulator;
            if (instance && typeof instance.destroy === "function") {
                try {
                    instance.destroy();
                } catch (err) {
                    console.warn("Could not destroy the emulator cleanly:", err);
                }
            }

            delete window.EJS_emulator;
            document.getElementById("game").innerHTML = "";

            const oldLoader = document.getElementById("ejs-loader");
            if (oldLoader) oldLoader.remove();

            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }
        }

        function launchGame(file) {
            const core = detectCore(file.name);
            if (!core) {
                alert("That file type isn't supported yet. Try a .nes, .smc, .sfc, .n64, .z64, .gba, .gb, .gbc, or .nds file.");
                return;
            }

            teardownEmulator();

            currentBlobUrl = URL.createObjectURL(file);

            window.EJS_player = "#game";
            window.EJS_core = core;
            window.EJS_gameUrl = currentBlobUrl;
            window.EJS_gameName = file.name;
            window.EJS_pathtodata = DATA_PATH;
            window.EJS_startOnLoaded = true;

            emulatorWrapper.style.display = "block";

            const loader = document.createElement("script");
            loader.id = "ejs-loader";
            loader.src = LOADER_URL;
            document.body.appendChild(loader);
        }

        function closeGame() {
            teardownEmulator();
            emulatorWrapper.style.display = "none";
        }

        discoverTile.addEventListener("click", openGameModeModal);

        modeButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const mode = button.dataset.mode;
                closeGameModeModal();

                if (mode === "emulator") {
                    romInput.click();
                    return;
                }

                if (gamesContainer) {
                    gamesContainer.style.display = "block";
                    loadLuminSDK().catch(() => {
                        console.error("Lumin SDK failed to load.");
                    });
                    gamesContainer.scrollIntoView({ behavior: "smooth", block: "start" });
                }
            });
        });

        romInput.addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (file) launchGame(file);
            event.target.value = "";
        });

        closeButton.addEventListener("click", closeGame);
    </script>
</body>
</html>
